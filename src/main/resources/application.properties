spring.application.name=konyvklub

# A hosztoló szolgáltatók a PORT változóban adják meg a portot; helyben 9090
server.port=${PORT:9090}

# Firebase service account: éles szerveren a FIREBASE_SERVICE_ACCOUNT_JSON környezeti
# változó (a JSON teljes tartalma), fejlesztéskor a serviceAccountKey.json fájl
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
firebase.service-account-path=serviceAccountKey.json

# Mely weboldalak hívhatják az API-t (vesszővel elválasztva, útvonal NÉLKÜL).
# Éles szerveren a CORS_ALLOWED_ORIGINS környezeti változóval felülírható.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://Horvath-Andras.github.io,http://localhost:5500,http://127.0.0.1:5500}

# Hogy a kliensek (web, később android) lássák a hibaüzeneteket
server.error.include-message=always
